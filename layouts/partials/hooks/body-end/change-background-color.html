<script>
  (() => {
    const background = document.getElementById('page-bg');
    if (!background || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    let hue = 0;
    let isDark = document.documentElement.classList.contains('dark');
    background.style.willChange = 'filter';

    document.addEventListener('hbThemeChange', (event) => {
      isDark = event.detail.isDarkTheme();
    });

    window.setInterval(() => {
      hue = (hue + 1) % 360;
      background.style.filter = isDark
        ? `hue-rotate(${hue}deg) invert(1) saturate(2)`
        : `hue-rotate(${hue}deg)`;
    }, 5000 / 360);
  })();
</script>
