[build]
  command = "npm ci && hugo --gc --minify --baseURL $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.164.0"
  HUGO_ENABLEGITINFO = "true"
  NODE_VERSION = "22"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "npm ci && hugo --gc --minify --buildFuture --baseURL $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "npm ci && hugo --gc --minify --baseURL $DEPLOY_PRIME_URL"
